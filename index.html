<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07100d">
<title>Signal Bastion</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#ecfff8;background:#07100d;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#07100d;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
#game{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;inset:0;pointer-events:none;padding:max(9px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(9px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.glass{background:rgba(6,18,14,.78);border:1px solid rgba(159,255,217,.16);backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);box-shadow:0 8px 28px rgba(0,0,0,.18)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.stats{display:flex;border-radius:13px;overflow:hidden}.stat{min-width:67px;padding:8px 11px;border-right:1px solid rgba(159,255,217,.1)}.stat:last-child{border-right:0}.stat span{display:block;font-size:9px;color:#83aa9b;text-transform:uppercase;letter-spacing:.13em}.stat strong{display:block;font-size:16px;margin-top:2px}
.actions{display:flex;gap:6px;pointer-events:auto}.icon,.primary{min-height:43px;border-radius:12px;border:1px solid rgba(159,255,217,.18);background:rgba(8,26,19,.9);padding:0 13px;font-weight:800}.primary{background:#9fffd9;color:#092018;border-color:#9fffd9;letter-spacing:.04em}.primary:disabled{opacity:.45}
.notice{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:8px 12px;border-radius:999px;font-size:11px;color:#b9dfd0;white-space:nowrap;max-width:42%;overflow:hidden;text-overflow:ellipsis}
.buildbar{position:absolute;left:50%;bottom:max(9px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:5px;padding:6px;border-radius:15px;pointer-events:auto}.tower-card{display:flex;align-items:center;gap:7px;min-width:100px;min-height:48px;padding:5px 9px;border:1px solid transparent;border-radius:10px;background:transparent;text-align:left}.tower-card.selected{background:rgba(132,255,205,.12);border-color:rgba(132,255,205,.42)}.tower-card:disabled{opacity:.45}.tower-card strong{display:block;font-size:11px;letter-spacing:.04em}.tower-card small{display:block;color:#79a895;font-size:9px;margin-top:2px}.dot{width:23px;height:23px;border-radius:7px;display:block;flex:0 0 23px}.b{background:#83f0c4}.c{background:#ffb36b}.s{background:#a7b6ff}
.panel{position:absolute;right:max(10px,env(safe-area-inset-right));top:64px;width:204px;padding:12px;border-radius:14px;pointer-events:auto}.panel.hidden,.modal.hidden,.debug.hidden{display:none}.panel-title{font-weight:900;font-size:13px}.panel-sub{color:#83aa9b;font-size:10px;margin-top:3px}.panel-actions{display:flex;gap:5px;margin-top:10px}.panel-actions button{flex:1;min-height:36px;border-radius:9px;border:1px solid #315847;background:#10291f;font-size:10px;font-weight:800}.panel-actions .danger{color:#ff9e96;border-color:#69413d}
.modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(2,8,6,.72);pointer-events:auto}.modal-card{width:min(320px,80vw);padding:24px;border-radius:20px;text-align:center}.modal-card h1{margin:3px 0 6px;font-size:28px}.modal-card p{margin:0 0 18px;color:#83aa9b}.eyebrow{font-size:10px!important;letter-spacing:.18em;text-transform:uppercase}
.rotate{display:none;position:absolute;inset:0;z-index:30;background:#07100d;place-items:center;padding:24px}.rotate-card{max-width:300px;padding:25px;border-radius:18px;text-align:center}.rotate-card strong{display:block}.rotate-card span{display:block;color:#83aa9b;font-size:12px;margin-top:7px}.phone{font-size:40px;transform:rotate(90deg);margin-bottom:8px}
.debug{position:absolute;left:max(8px,env(safe-area-inset-left));bottom:70px;width:190px;padding:9px;border-radius:11px;z-index:12;pointer-events:auto;font:10px ui-monospace,SFMono-Regular,Menlo,monospace}.debug pre{margin:5px 0 7px;line-height:1.4}.debug-actions{display:grid;grid-template-columns:1fr 1fr;gap:4px}.debug button{min-height:30px;border:1px solid #315847;border-radius:6px;background:#10291f}.debug textarea{width:100%;margin-top:6px;background:#07130f;color:#9ac9b7;border:1px solid #315847;border-radius:6px;padding:5px;font:9px ui-monospace,SFMono-Regular,Menlo,monospace;resize:none}
@media (orientation:portrait){.rotate{display:grid}}
@media (max-height:430px){.stat{min-width:57px;padding:6px 8px}.stat span{display:none}.stat strong{font-size:14px}.icon,.primary{min-height:38px;padding:0 10px;font-size:11px}.notice{display:none}.tower-card{min-width:88px;min-height:42px;padding:4px 7px}.dot{width:19px;height:19px;flex-basis:19px}.panel{top:53px;width:188px}.buildbar{bottom:6px}}
</style>
</head>
<body>
<div id="app">
<canvas id="game" aria-label="3D tower defense playfield"></canvas>
<div class="hud">
  <div class="top">
    <div class="stats glass"><div class="stat"><span>Credits</span><strong id="money">$260</strong></div><div class="stat"><span>Lives</span><strong id="lives">20</strong></div><div class="stat"><span>Wave</span><strong id="wave">0/10</strong></div></div>
    <div class="actions"><button id="pause" class="icon glass" type="button" aria-label="Pause">Ⅱ</button><button id="start" class="primary" type="button">START WAVE 1</button></div>
  </div>
  <div id="notice" class="notice glass">BLASTER selected · tap a green build pad.</div>
  <div id="panel" class="panel glass hidden"><div id="tower-name" class="panel-title">Tower</div><div id="tower-stats" class="panel-sub">Level 1</div><div class="panel-actions"><button id="upgrade">UPGRADE</button><button id="sell" class="danger">SELL</button></div></div>
  <div class="buildbar glass"><button class="tower-card selected" data-tower="blaster"><span class="dot b"></span><span><strong>BLASTER</strong><small>$70</small></span></button><button class="tower-card" data-tower="cannon"><span class="dot c"></span><span><strong>CANNON</strong><small>$110</small></span></button><button class="tower-card" data-tower="sniper"><span class="dot s"></span><span><strong>SNIPER</strong><small>$150</small></span></button></div>
</div>
<div id="modal" class="modal hidden"><div class="modal-card glass"><p class="eyebrow">RUN COMPLETE</p><h1 id="result">VICTORY</h1><p id="result-copy">The bastion held.</p><button id="restart" class="primary">PLAY AGAIN</button></div></div>
<div class="rotate"><div class="rotate-card glass"><div class="phone">▯</div><strong>Rotate your phone</strong><span>Signal Bastion is designed for landscape play.</span></div></div>
<aside id="debug" class="debug glass hidden"><strong>DEBUG · v0.1</strong><pre id="debug-stats"></pre><div class="debug-actions"><button id="d-money">+$500</button><button id="d-spawn">Spawn</button><button id="d-kill">Kill all</button><button id="d-wave">Wave</button></div><textarea id="snapshot" rows="4" readonly></textarea></aside>
</div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
const PATH=[[-8.5,-3.2],[-5.1,-3.2],[-5.1,1.2],[-1.4,1.2],[-1.4,-2],[2.3,-2],[2.3,2.3],[5.6,2.3],[5.6,-.4],[8.5,-.4]];
const SLOTS=[[-6.8,-.6],[-3.3,-1],[-3.2,3],[.4,0],[.3,-3.8],[4,.3],[4.2,4],[7,1.4]];
const TOWERS={blaster:{label:"Blaster",cost:70,range:3.25,damage:11,rate:1.7,up:[55,95],color:0x83f0c4},cannon:{label:"Cannon",cost:110,range:2.75,damage:28,rate:.72,up:[80,125],color:0xffb36b},sniper:{label:"Sniper",cost:150,range:5.2,damage:52,rate:.42,up:[110,170],color:0xa7b6ff}};
const ENEMIES={runner:{hp:45,speed:1.65,reward:8,r:.25,color:0xf4d35e},grunt:{hp:85,speed:1.05,reward:11,r:.32,color:0x67b7dc},tank:{hp:230,speed:.62,reward:22,r:.42,color:0xe0675f}};
const WAVES=[[['runner',7,.8]],[['grunt',6,1]],[['runner',10,.55],['grunt',4,.9,1.2]],[['grunt',9,.72]],[['tank',3,1.5],['runner',8,.45,.5]],[['grunt',12,.62]],[['tank',5,1.25],['grunt',6,.7]],[['runner',18,.34],['tank',3,1.4,1]],[['grunt',13,.52],['tank',5,1.1]],[['tank',8,.95],['runner',16,.28,.5]]];
const DAMAGE=[1,1.48,2.08],RANGE=[1,1.08,1.16];
const state={money:260,lives:20,wave:0,waveActive:false,paused:false,won:false,lost:false,time:0,enemyId:1,towerId:1,enemies:[],towers:[],queue:[],selectedType:"blaster",selectedTower:null};
const canvas=document.querySelector('#game');const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;const scene=new THREE.Scene();scene.background=new THREE.Color(0x07100d);const camera=new THREE.OrthographicCamera(-8,8,5,-5,.1,100);camera.position.set(12,14,12);camera.lookAt(0,0,0);scene.add(new THREE.HemisphereLight(0xa9e8d0,0x14221c,2));const sun=new THREE.DirectionalLight(0xffffff,1.6);sun.position.set(-6,12,5);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(24,16),new THREE.MeshStandardMaterial({color:0x0d1c17,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.04;scene.add(ground);const grid=new THREE.GridHelper(24,24,0x193329,0x12271f);grid.position.y=.005;scene.add(grid);const pathMat=new THREE.MeshStandardMaterial({color:0x263931,roughness:.92});for(let i=0;i<PATH.length-1;i++){const a=PATH[i],b=PATH[i+1],dx=b[0]-a[0],dz=b[1]-a[1],len=Math.hypot(dx,dz);const m=new THREE.Mesh(new THREE.BoxGeometry(len+.7,.08,1.05),pathMat);m.position.set((a[0]+b[0])/2,.04,(a[1]+b[1])/2);m.rotation.y=-Math.atan2(dz,dx);scene.add(m)}const end=PATH.at(-1);const base=new THREE.Mesh(new THREE.CylinderGeometry(.65,.85,.55,6),new THREE.MeshStandardMaterial({color:0x1e6d54,emissive:0x082a20}));base.position.set(end[0],.28,end[1]);scene.add(base);const slotMeshes=SLOTS.map((p,i)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(.52,.58,.12,16),new THREE.MeshStandardMaterial({color:0x173c30,emissive:0x000000}));m.position.set(p[0],.06,p[1]);m.userData.slotIndex=i;scene.add(m);return m});[[-8,3.7],[-6.5,3.3],[7,-3.5],[6.5,-2.8],[0,4.5],[8,3.8]].forEach(([x,z],i)=>{const m=new THREE.Mesh(new THREE.DodecahedronGeometry(.28+(i%3)*.08,0),new THREE.MeshStandardMaterial({color:0x162b23}));m.position.set(x,.18,z);m.rotation.set(i*.7,i*.4,i*.2);scene.add(m)});
const enemyMeshes=new Map(),towerGroups=new Map(),tracers=[];function resize(){const w=canvas.clientWidth||innerWidth,h=canvas.clientHeight||innerHeight;renderer.setSize(w,h,false);const aspect=w/Math.max(h,1),vh=12.2,vw=vh*aspect;camera.left=-vw/2;camera.right=vw/2;camera.top=vh/2;camera.bottom=-vh/2;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
function reset(){Object.assign(state,{money:260,lives:20,wave:0,waveActive:false,paused:false,won:false,lost:false,time:0,enemyId:1,towerId:1,enemies:[],towers:[],queue:[],selectedTower:null});for(const m of enemyMeshes.values()){scene.remove(m);m.geometry.dispose();m.material.dispose()}enemyMeshes.clear();for(const g of towerGroups.values())scene.remove(g);towerGroups.clear();document.querySelector('#modal').classList.add('hidden');notice('BLASTER selected · tap a green build pad.');updateUI()}
function notice(t){document.querySelector('#notice').textContent=t}
function build(slot,type){if(state.towers.some(t=>t.slot===slot))return null;const c=TOWERS[type];if(state.money<c.cost){notice('Need $'+c.cost+' for '+c.label+'.');return null}state.money-=c.cost;const t={id:state.towerId++,type,slot,level:1,cooldown:0,spent:c.cost};state.towers.push(t);selectTower(t.id);return t}
function selectTower(id){state.selectedTower=id;const t=state.towers.find(x=>x.id===id);document.querySelector('#panel').classList.toggle('hidden',!t);for(const [tid,g] of towerGroups)g.scale.setScalar(tid===id?1.1:1);updateUI()}
function startWave(){if(state.waveActive||state.wave>=WAVES.length||state.won||state.lost)return;state.waveActive=true;state.queue=[];let cursor=state.time+.2;for(const [type,count,interval,delay=0] of WAVES[state.wave]){cursor+=delay;for(let i=0;i<count;i++)state.queue.push({type,at:cursor+i*interval});cursor+=count*interval}state.queue.sort((a,b)=>a.at-b.at);notice('Wave '+(state.wave+1)+' incoming.');updateUI()}
function spawn(type='grunt'){const c=ENEMIES[type],p=PATH[0],e={id:state.enemyId++,type,hp:c.hp,maxHp:c.hp,speed:c.speed,reward:c.reward,r:c.r,seg:0,t:0,progress:0,x:p[0],z:p[1],alive:true};state.enemies.push(e);return e}
function update(dt){if(state.paused||state.won||state.lost)return;dt=Math.min(Math.max(dt,0),.1);state.time+=dt;while(state.queue.length&&state.queue[0].at<=state.time){const j=state.queue.shift();spawn(j.type)}for(const e of state.enemies){if(!e.alive)continue;let rem=e.speed*dt;while(rem>0&&e.alive){if(e.seg>=PATH.length-1){e.alive=false;state.lives--;if(state.lives<=0){state.lives=0;state.lost=true}break}const a=PATH[e.seg],b=PATH[e.seg+1],dx=b[0]-a[0],dz=b[1]-a[1],len=Math.hypot(dx,dz),left=len*(1-e.t);if(rem>=left){rem-=left;e.progress+=left;e.seg++;e.t=0;e.x=b[0];e.z=b[1]}else{e.t+=rem/len;e.progress+=rem;e.x=a[0]+dx*e.t;e.z=a[1]+dz*e.t;rem=0}}}for(const t of state.towers){t.cooldown-=dt;if(t.cooldown>0)continue;const c=TOWERS[t.type],p=SLOTS[t.slot],range=c.range*RANGE[t.level-1];let target;for(const e of state.enemies){if(!e.alive)continue;if(Math.hypot(e.x-p[0],e.z-p[1])<=range&&(!target||e.progress>target.progress))target=e}if(!target)continue;target.hp-=c.damage*DAMAGE[t.level-1];t.cooldown=1/c.rate;addTracer(t,target,c.color);if(target.hp<=0&&target.alive){target.alive=false;state.money+=target.reward}}state.enemies=state.enemies.filter(e=>e.alive);if(state.waveActive&&!state.queue.length&&!state.enemies.length){state.waveActive=false;state.wave++;if(state.wave>=WAVES.length){state.won=true}else notice('Wave cleared. Build or upgrade before Wave '+(state.wave+1)+'.')}if(state.won||state.lost)showEnd()}
function addTracer(t,e,color){const p=SLOTS[t.slot],pts=[new THREE.Vector3(p[0],.72,p[1]),new THREE.Vector3(e.x,.34,e.z)],geo=new THREE.BufferGeometry().setFromPoints(pts),line=new THREE.Line(geo,new THREE.LineBasicMaterial({color,transparent:true,opacity:.95}));scene.add(line);tracers.push({line,ttl:.09})}
function syncMeshes(dt){const alive=new Set(state.enemies.map(e=>e.id));for(const [id,m] of enemyMeshes)if(!alive.has(id)){scene.remove(m);m.geometry.dispose();m.material.dispose();enemyMeshes.delete(id)}for(const e of state.enemies){let m=enemyMeshes.get(e.id);if(!m){m=new THREE.Mesh(e.type==='tank'?new THREE.BoxGeometry(e.r*1.7,e.r*1.5,e.r*1.7):new THREE.IcosahedronGeometry(e.r,1),new THREE.MeshStandardMaterial({color:ENEMIES[e.type].color,roughness:.55}));enemyMeshes.set(e.id,m);scene.add(m)}m.position.set(e.x,e.r*.85,e.z);m.rotation.y+=dt*(e.type==='runner'?3:1)}const ids=new Set(state.towers.map(t=>t.id));for(const [id,g] of towerGroups)if(!ids.has(id)){scene.remove(g);towerGroups.delete(id)}for(const t of state.towers){let g=towerGroups.get(t.id);const c=TOWERS[t.type],p=SLOTS[t.slot];if(!g){g=new THREE.Group();g.userData.towerId=t.id;const pedestal=new THREE.Mesh(new THREE.CylinderGeometry(.42,.5,.28,8),new THREE.MeshStandardMaterial({color:0x243c33,metalness:.15,roughness:.65}));const body=new THREE.Mesh(t.type==='sniper'?new THREE.BoxGeometry(.25,.28,1):new THREE.CylinderGeometry(.25,.31,.58,8),new THREE.MeshStandardMaterial({color:c.color,roughness:.42}));body.position.y=.48;if(t.type==='sniper')body.position.z=-.18;g.add(pedestal,body);for(const child of g.children)child.userData.towerId=t.id;g.position.set(p[0],.14,p[1]);towerGroups.set(t.id,g);scene.add(g)}g.scale.setScalar(state.selectedTower===t.id?1.1:1)}for(let i=tracers.length-1;i>=0;i--){const tr=tracers[i];tr.ttl-=dt;tr.line.material.opacity=Math.max(0,tr.ttl/.09);if(tr.ttl<=0){scene.remove(tr.line);tr.line.geometry.dispose();tr.line.material.dispose();tracers.splice(i,1)}}}
function updateUI(){document.querySelector('#money').textContent='$'+state.money;document.querySelector('#lives').textContent=state.lives;document.querySelector('#wave').textContent=state.wave+'/10';const start=document.querySelector('#start');start.disabled=state.waveActive||state.wave>=10||state.won||state.lost;start.textContent=state.waveActive?'WAVE ACTIVE':state.wave>=10?'COMPLETE':'START WAVE '+(state.wave+1);document.querySelector('#pause').textContent=state.paused?'▶':'Ⅱ';document.querySelectorAll('.tower-card').forEach(b=>{const type=b.dataset.tower;b.classList.toggle('selected',type===state.selectedType);b.disabled=state.money<TOWERS[type].cost});const t=state.towers.find(x=>x.id===state.selectedTower),panel=document.querySelector('#panel');panel.classList.toggle('hidden',!t);if(t){const c=TOWERS[t.type];document.querySelector('#tower-name').textContent=c.label.toUpperCase();document.querySelector('#tower-stats').textContent='Level '+t.level+' · DMG '+Math.round(c.damage*DAMAGE[t.level-1])+' · Range '+(c.range*RANGE[t.level-1]).toFixed(1);const up=document.querySelector('#upgrade');up.disabled=t.level>=3||state.money<c.up[t.level-1];up.textContent=t.level>=3?'MAX LEVEL':'UPGRADE $'+c.up[t.level-1];document.querySelector('#sell').textContent='SELL $'+Math.floor(t.spent*.6)}}
function showEnd(){const modal=document.querySelector('#modal');modal.classList.remove('hidden');document.querySelector('#result').textContent=state.won?'VICTORY':'BASTION LOST';document.querySelector('#result-copy').textContent=state.won?'All 10 waves cleared.':'The route was breached.'}
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();canvas.addEventListener('pointerup',ev=>{const r=canvas.getBoundingClientRect();ptr.x=((ev.clientX-r.left)/r.width)*2-1;ptr.y=-((ev.clientY-r.top)/r.height)*2+1;ray.setFromCamera(ptr,camera);const hits=ray.intersectObjects([...slotMeshes,...towerGroups.values()],true);let pick=null;for(const h of hits){let o=h.object;while(o){if(typeof o.userData.towerId==='number'){pick={tower:o.userData.towerId};break}if(typeof o.userData.slotIndex==='number'){pick={slot:o.userData.slotIndex};break}o=o.parent}if(pick)break}if(!pick){selectTower(null);return}if(pick.tower){selectTower(pick.tower);return}const existing=state.towers.find(t=>t.slot===pick.slot);if(existing){selectTower(existing.id);return}build(pick.slot,state.selectedType);updateUI()});
document.querySelectorAll('.tower-card').forEach(b=>b.addEventListener('click',()=>{state.selectedType=b.dataset.tower;state.selectedTower=null;selectTower(null);notice(TOWERS[state.selectedType].label.toUpperCase()+' selected · tap a green build pad.');updateUI()}));document.querySelector('#start').addEventListener('click',startWave);document.querySelector('#pause').addEventListener('click',()=>{state.paused=!state.paused;updateUI()});document.querySelector('#upgrade').addEventListener('click',()=>{const t=state.towers.find(x=>x.id===state.selectedTower);if(!t||t.level>=3)return;const c=TOWERS[t.type],cost=c.up[t.level-1];if(state.money<cost)return;state.money-=cost;t.spent+=cost;t.level++;notice(c.label+' upgraded to Level '+t.level+'.');updateUI()});document.querySelector('#sell').addEventListener('click',()=>{const i=state.towers.findIndex(x=>x.id===state.selectedTower);if(i<0)return;state.money+=Math.floor(state.towers[i].spent*.6);state.towers.splice(i,1);state.selectedTower=null;selectTower(null);updateUI()});document.querySelector('#restart').addEventListener('click',reset);
const debug=location.search.includes('debug=1');if(debug){document.querySelector('#debug').classList.remove('hidden');document.querySelector('#d-money').onclick=()=>{state.money+=500;updateUI()};document.querySelector('#d-spawn').onclick=()=>spawn('grunt');document.querySelector('#d-kill').onclick=()=>{state.enemies=[];state.queue=[]};document.querySelector('#d-wave').onclick=startWave}
let last=performance.now(),acc=0,frames=0,fpsTime=last,fps=0;function loop(now){const frame=Math.min((now-last)/1000,.1);last=now;acc+=frame;while(acc>=1/60){update(1/60);acc-=1/60}syncMeshes(frame);updateUI();renderer.render(scene,camera);frames++;if(debug&&now-fpsTime>500){fps=Math.round(frames*1000/(now-fpsTime));frames=0;fpsTime=now;document.querySelector('#debug-stats').textContent='FPS '+fps+'\nFrame '+(frame*1000).toFixed(1)+'ms\nDraw '+renderer.info.render.calls+'\nEnemies '+state.enemies.length+'\nTowers '+state.towers.length;document.querySelector('#snapshot').value=JSON.stringify({wave:state.wave,money:state.money,lives:state.lives,enemies:state.enemies.length,towers:state.towers.length,fps})}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body>
</html>
